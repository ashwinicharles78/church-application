<!-- <h1>Angular Router App</h1> -->
<header>
  <div class="header-container">
      <a class="brand" routerLink="/" aria-label="Central Methodist Church home">
        <img src="assets/logo.png" alt="" class="logo">
        <span>Central Methodist<br><strong>Church</strong></span>
      </a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a></li>
          <li><a routerLink="/members" routerLinkActive="active" ariaCurrentWhenActive="page">Members</a></li>
          <li><a routerLink="/tree" routerLinkActive="active" ariaCurrentWhenActive="page">Family Tree</a></li>
          <li><a routerLink="/inventory" routerLinkActive="active" ariaCurrentWhenActive="page">Inventory</a></li>
        </ul>
      </nav>
  </div>
</header>
<main>

  <!-- The routed views render in the <router-outlet>-->
<router-outlet></router-outlet>
</main>
<footer>
  <p>Central Methodist Church <span aria-hidden="true">·</span> Membership &amp; community</p>
</footer>
